<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ruleta Just Dance PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
  background: radial-gradient(circle at top, #1f1f2e, #0f0f18);
  color:white;
  min-height:100vh;
  padding:20px;
  overflow-x:hidden;
  font-family: Arial, sans-serif;
}

h1{
  text-align:center;
  margin-bottom:30px;
  font-weight:bold;
}

/* CONTENIDO PRINCIPAL */

.panel{
  text-align:center;
}

.portada{
  width:250px;
  max-width:100%;
  border-radius:20px;
  margin-top:15px;
  box-shadow:0 0 25px rgba(255,255,255,0.2);
  transition:0.3s;
}

.portada:hover{
  transform:scale(1.03);
}

.btn-girar{
  margin-top:20px;
  font-size:20px;
  padding:12px 30px;
  font-weight:bold;
  border-radius:15px;
}

/* OVERLAY RULETA */

.overlay-ruleta{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,0.88);
  backdrop-filter:blur(10px);

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:9999;

  opacity:0;
  pointer-events:none;

  transition:opacity 0.4s ease;
}

.overlay-ruleta.activo{
  opacity:1;
  pointer-events:all;
}

/* CONTENEDOR RULETA */

.ruleta-overlay-contenido{
  position:relative;
}

/* RULETA */

.ruleta{
  border-radius:50%;
  overflow:hidden;
  position:relative;

  border:10px solid white;

  transition:transform 5s cubic-bezier(0.2,0.8,0.2,1);

  box-shadow:
    0 0 40px rgba(255,255,255,0.3),
    0 0 90px rgba(255,152,0,0.35);
}

.gigante{
  width:650px;
  height:650px;
}

/* SEGMENTOS */

.segmento{
  position:absolute;

  width:50%;
  height:50%;

  transform-origin:100% 100%;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.segmento span{
  display:block;
  width:180px;

  font-size:12px;
  font-weight:bold;
  color:white;

  text-align:right;

  padding-right:15px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* FLECHA */

.flecha-overlay{
  position:absolute;

  top:-70px;
  left:50%;

  transform:translateX(-50%);

  font-size:70px;

  z-index:5;

  text-shadow:0 0 20px white;
}

/* GLOW */

@keyframes glow{
  0%{
    box-shadow:
      0 0 20px rgba(255,255,255,0.3),
      0 0 50px rgba(255,152,0,0.3);
  }

  50%{
    box-shadow:
      0 0 40px rgba(255,255,255,0.6),
      0 0 100px rgba(255,152,0,0.6);
  }

  100%{
    box-shadow:
      0 0 20px rgba(255,255,255,0.3),
      0 0 50px rgba(255,152,0,0.3);
  }
}

.activa{
  animation:glow 1s infinite;
}

/* HISTORIAL */

.historial-box{
  margin-top:20px;
  background:rgba(255,255,255,0.08);
  border-radius:15px;
  padding:15px;
}

/* RESPONSIVE */

@media(max-width:768px){

  .gigante{
    width:90vw;
    height:90vw;
  }

  .segmento span{
    width:100px;
    font-size:9px;
  }

  .flecha-overlay{
    font-size:50px;
    top:-50px;
  }

}

</style>
</head>

<body>

<h1>🎡 Ruleta Just Dance PRO</h1>

<div class="container">

  <div class="row align-items-center">

    <!-- IZQUIERDA -->
    <div class="col-md-5 text-center">

      <select id="selectorJuego" class="form-select mb-4">
        <option value="">Selecciona un juego</option>
      </select>

      <button class="btn btn-warning btn-girar" onclick="girar()">
        🎡 GIRAR RULETA
      </button>

    </div>

    <!-- DERECHA -->
    <div class="col-md-7 panel">

      <h2 id="nombre">🎶 Esperando canción...</h2>

      <p id="artista" class="fs-5"></p>

      <img
        id="portada"
        class="portada"
        src="portadas/default.webp"
      >

      <audio
        id="player"
        controls
        class="w-100 mt-4">
      </audio>

      <div class="historial-box">
        <h5>Historial</h5>
        <p>
          Canciones usadas:
          <span id="historialCount">0</span>
        </p>
      </div>

    </div>

  </div>

</div>

<!-- OVERLAY RULETA -->

<div id="overlayRuleta" class="overlay-ruleta">

  <div class="ruleta-overlay-contenido">

    <div class="flecha-overlay">
      ▼
    </div>

    <div class="ruleta gigante" id="ruleta"></div>

  </div>

</div>

<script>

let canciones = [];
let filtradas = [];
let historial = [];

let rotacion = 0;

/* CARGAR JSON */

fetch('canciones.json')
.then(r => r.json())
.then(data => {

  canciones = data;

  cargarJuegos();

});

/* CARGAR JUEGOS */

function cargarJuegos(){

  const selector =
    document.getElementById('selectorJuego');

  const juegos =
    [...new Set(canciones.map(c => c.juego))];

  juegos.forEach(j => {

    const opt =
      document.createElement('option');

    opt.value = j;
    opt.textContent = j;

    selector.appendChild(opt);

  });

}

/* CAMBIO DE JUEGO */

document
.getElementById('selectorJuego')
.addEventListener('change', e => {

  filtradas =
    canciones.filter(c =>
      c.juego === e.target.value &&
      c.audioDisponible
    );

  historial = [];

  crearRuleta();

});

/* CREAR RULETA */

function crearRuleta(){

  const ruleta =
    document.getElementById('ruleta');

  ruleta.innerHTML = "";

  if(filtradas.length === 0) return;

  let total = filtradas.length;

  let angulo = 360 / total;

  filtradas.forEach((c, i) => {

    let seg =
      document.createElement('div');

    seg.className = "segmento";

    seg.style.transform =
      `rotate(${i * angulo}deg)
       skewY(${90 - angulo}deg)`;

    seg.style.background =
      i % 2
      ? "#ff9800"
      : "#03a9f4";

    seg.innerHTML = `
      <span style="
        transform:
          skewY(${-(90 - angulo)}deg)
          rotate(${angulo/2}deg);
      ">
        ${c.cancion}
      </span>
    `;

    ruleta.appendChild(seg);

  });

  /* FIX BUG INICIAL */

  ruleta.style.transition = 'none';

  ruleta.style.transform =
    'rotate(0.01deg)';

  setTimeout(() => {

    ruleta.style.transition =
      'transform 5s cubic-bezier(0.2,0.8,0.2,1)';

  }, 50);

}

/* GIRAR */

function girar(){

  if(filtradas.length === 0) return;

  const ruleta =
    document.getElementById('ruleta');

  const overlay =
    document.getElementById('overlayRuleta');

  overlay.classList.add('activo');

  /* reset historial */

  if(historial.length === filtradas.length){

    historial = [];

  }

  /* canciones disponibles */

  let disponibles =
    filtradas.filter(c =>
      !historial.includes(c.codigo)
    );

  /* random */

  let random =
    disponibles[
      Math.floor(
        Math.random() *
        disponibles.length
      )
    ];

  let index =
    filtradas.indexOf(random);

  historial.push(random.codigo);

  document.getElementById(
    'historialCount'
  ).textContent = historial.length;

  /* giro */

  let angulo =
    360 / filtradas.length;

  let grados =
    3600 + (360 - index * angulo);

  rotacion += grados;

  ruleta.classList.add('activa');

  ruleta.style.transform =
    `rotate(${rotacion}deg)`;

  setTimeout(() => {

    ruleta.classList.remove('activa');

    mostrarResultado(random);

  }, 5000);

  /* cerrar overlay */

  setTimeout(() => {

    overlay.classList.remove('activo');

  }, 5600);

}

/* RESULTADO */

function mostrarResultado(c){

  document.getElementById(
    'nombre'
  ).textContent = c.cancion;

  document.getElementById(
    'artista'
  ).textContent = c.artista;

  /* portada */

  const portada =
    document.getElementById('portada');

  portada.src =
    `portadas/${c.version}/${c.codigo}.webp`;

  portada.onerror = () => {

    portada.src =
      'portadas/default.webp';

  };

  /* audio */

  const player =
    document.getElementById('player');

  player.src =
    `musica/${c.version}/${c.codigo}.ogg`;

  player.play().catch(()=>{});

}

</script>

</body>
</html>
