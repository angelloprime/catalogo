<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Dance Championship - Ultra Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-neon: #00f2ff;
            --secondary-neon: #bc00ff;
            --bg-dark: #050510;
            --panel-bg: rgba(20, 20, 40, 0.7);
        }

        body { margin: 0; overflow-x: hidden; background: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; }
        h1 { text-align: center; margin-top: 20px; font-weight: 800; color: var(--primary-neon); text-shadow: 0 0 15px var(--primary-neon); text-transform: uppercase; }
        
        .panel { background: var(--panel-bg); border-radius: 20px; padding: 20px; backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.2); height: 100%; }
        .text-neon { color: var(--primary-neon); text-shadow: 0 0 5px var(--primary-neon); }
        
        /* TABLA CORREGIDA */
        .table { color: white !important; font-size: 0.85rem; vertical-align: middle; }
        .table th { border-bottom: 2px solid var(--secondary-neon); color: var(--secondary-neon); text-transform: uppercase; text-align: center; white-space: nowrap; }
        .table td { border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; padding: 10px 2px; }

        .btn-neon { background: transparent; border: 2px solid var(--primary-neon); color: var(--primary-neon); font-weight: bold; transition: 0.3s; }
        .btn-neon:hover:not(:disabled) { background: var(--primary-neon); color: black; box-shadow: 0 0 20px var(--primary-neon); }
        .btn-neon:disabled { border-color: #444; color: #444; }

        .player-tag { display: inline-block; background: var(--secondary-neon); color: white; padding: 4px 12px; border-radius: 8px; margin: 3px; font-size: 0.9rem; font-weight: bold; border: 1px solid white; }

        /* RULETA */
        .overlay { position: fixed; inset: 0; background: radial-gradient(circle, #1a0033 0%, #000 100%); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.4s; z-index: 9999; }
        .overlay.active { opacity: 1; pointer-events: all; }
        .scene { width: 300px; height: 400px; perspective: 2000px; display: flex; justify-content: center; align-items: center; }
        .carousel { position: relative; width: 220px; height: 300px; transform-style: preserve-3d; transition: transform 10s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .card { position: absolute; width: 220px; height: 300px; border-radius: 15px; overflow: hidden; background: #000; border: 3px solid var(--primary-neon); backface-visibility: hidden; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        
        .pointer { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); font-size: 80px; z-index: 10001; color: #ff0044; text-shadow: 0 0 20px #ff0044; filter: drop-shadow(0 0 5px white); }
    </style>
</head>
<body>

<h1>🎡 Just Dance Championship</h1>

<div class="container-fluid px-4 mt-3">
    <div class="row g-3">
        <!-- IZQUIERDA: JUGADORES -->
        <div class="col-lg-4">
            <div class="panel">
                <h6 class="text-neon mb-3">👤 REGISTRO Y RANKING</h6>
                <div class="input-group mb-3">
                    <input type="text" id="playerName" class="form-control bg-dark text-white border-secondary" placeholder="Nombre...">
                    <button class="btn btn-neon" onclick="addPlayer()">+</button>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th class="text-start">Nombre</th>
                                <th>💃</th>
                                <th>Pts</th>
                                <th>Bonif</th>
                                <th class="text-neon">Total</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody"></tbody>
                    </table>
                </div>

                <div id="selectionPanel" class="mt-4" style="display:none;">
                    <h6 class="text-neon">🤝 PRÓXIMA RONDA (MÁX 4)</h6>
                    <button class="btn btn-sm btn-outline-info w-100 mb-2" onclick="pickParticipants()">DECIDIR QUIÉNES BAILAN</button>
                    <div id="nextMatch" class="p-3 border border-info rounded text-center" style="background: rgba(0,0,0,0.3);">
                        <small class="text-secondary">Haz clic arriba para equilibrar</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- DERECHA: RULETA Y PUNTOS -->
        <div class="col-lg-8">
            <div class="panel">
                <div class="row mb-3 align-items-center">
                    <div class="col-md-7">
                        <select id="gameSelect" class="form-select bg-dark text-white border-secondary"></select>
                    </div>
                    <div class="col-md-5 text-end">
                        <span id="songCount" class="badge bg-primary px-3 py-2"></span>
                    </div>
                </div>

                <button id="btnSpin" class="btn btn-neon w-100 py-3 mb-4" onclick="spin()" disabled>🎡 GIRAR RULETA</button>

                <div class="text-center mb-4">
                    <h2 id="songName" class="text-neon fw-bold">Selecciona un juego</h2>
                    <img id="cover" class="img-fluid rounded-4 shadow-lg" src="portadas/default.webp" style="max-height: 250px; border: 2px solid #333;">
                    <audio id="audio" controls class="w-100 mt-3" style="max-width: 500px; margin: auto;"></audio>
                </div>

                <div id="scoreForm" class="mt-2 p-3 rounded-4 border border-secondary" style="display:none; background: rgba(0,0,0,0.5);">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="text-info m-0">⭐ ASIGNAR PUNTOS</h6>
                        <div>
                            <button class="btn btn-sm btn-warning me-2" onclick="undoLastScore()">Deshacer</button>
                            <button class="btn btn-sm btn-danger" onclick="resetRoundControls()">Siguiente Canción</button>
                        </div>
                    </div>
                    
                    <div class="row g-2">
                        <div class="col-md-4">
                            <select id="playerSelect" class="form-select bg-dark text-white border-info"></select>
                        </div>
                        <div class="col-md-3">
                            <select id="puestoSelect" class="form-select bg-dark text-white border-info">
                                <option value="" selected disabled>Puesto...</option>
                                <option value="5" data-id="p1">1° Lugar (+5)</option>
                                <option value="4" data-id="p2">2° Lugar (+4)</option>
                                <option value="2" data-id="p3">3° Lugar (+2)</option>
                                <option value="1" data-id="p4">4° o más (+1)</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select id="estrellasSelect" class="form-select bg-dark text-white border-info">
                                <option value="3">5 Estrellas (+3)</option>
                                <option value="2">4 Estrellas (+2)</option>
                                <option value="1">3 Estrellas (+1)</option>
                                <option value="0">2 o menos (+0)</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-success w-100" onclick="saveScore()">Ok</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="overlay" class="overlay">
    <div class="pointer">▼</div>
    <div class="scene">
        <div id="carousel" class="carousel"></div>
    </div>
</div>

<script>
let songs = [], filtered = [], history = [], players = [];
let currentRotation = 0;
let usedPuestos = new Set();
let usedPlayersInRound = new Set();
let roundHistory = [];

fetch('canciones.json').then(r => r.json()).then(data => {
    songs = data;
    const select = document.getElementById('gameSelect');
    const games = [...new Set(songs.map(s => s.juego))];
    select.innerHTML = '<option value="">Elige un Just Dance...</option>';
    games.forEach(g => { select.innerHTML += `<option value="${g}">${g}</option>`; });
});

document.getElementById('gameSelect').addEventListener('change', e => {
    filtered = songs.filter(s => s.juego === e.target.value && s.portadaDisponible);
    history = [];
    document.getElementById('songCount').textContent = `Disponibles: ${filtered.length}`;
    document.getElementById('btnSpin').disabled = !e.target.value;
    if(e.target.value) createWheel();
});

function createWheel() {
    const carousel = document.getElementById('carousel');
    carousel.innerHTML = "";
    const list = filtered.slice(0, 20); 
    const angle = 360 / list.length;
    list.forEach((song, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.transform = `rotateY(${i * angle}deg) translateZ(800px)`;
        card.innerHTML = `<img src="portadas/${song.version}/${song.codigo}.webp" onerror="this.src='portadas/default.webp'">`;
        carousel.appendChild(card);
    });
}

function spin() {
    const available = filtered.filter(s => !history.includes(s.codigo));
    if(available.length === 0) history = [];
    
    const songToPick = available[Math.floor(Math.random() * available.length)];
    const visibleList = filtered.slice(0, 20);
    let targetIndex = visibleList.findIndex(s => s.codigo === songToPick.codigo);

    if(targetIndex === -1) {
        targetIndex = Math.floor(Math.random() * visibleList.length);
        const cards = document.querySelectorAll('.card');
        cards[targetIndex].innerHTML = `<img src="portadas/${songToPick.version}/${songToPick.codigo}.webp">`;
    }

    const overlay = document.getElementById('overlay');
    const carousel = document.getElementById('carousel');
    overlay.classList.add('active');

    const anglePerCard = 360 / visibleList.length;
    const vueltas = 12 * 360;
    const targetAngle = targetIndex * anglePerCard;
    
    currentRotation = (Math.ceil(currentRotation / 360) * 360) + vueltas - targetAngle;
    carousel.style.transform = `rotateY(${currentRotation}deg)`;

    setTimeout(() => {
        showResult(songToPick);
        history.push(songToPick.codigo);
        overlay.classList.remove('active');
        resetRoundControls();
    }, 10500);
}

function showResult(song) {
    document.getElementById('songName').textContent = song.cancion;
    document.getElementById('cover').src = `portadas/${song.version}/${song.codigo}.webp`;
    document.getElementById('audio').src = `musica/${song.version}/${song.codigo}.ogg`;
    document.getElementById('audio').play().catch(()=>{});
    if(players.length > 0) document.getElementById('scoreForm').style.display = 'block';
}

function addPlayer() {
    const name = document.getElementById('playerName').value.trim();
    if(name && !players.find(p => p.nombre === name)) {
        players.push({ nombre: name, bailes: 0, pts: 0, bonif: 0, total: 0 });
        document.getElementById('playerName').value = "";
        updateLeaderboard();
        document.getElementById('selectionPanel').style.display = players.length > 4 ? 'block' : 'none';
    }
}

function updateLeaderboard() {
    const tbody = document.getElementById('leaderboardBody');
    tbody.innerHTML = "";
    players.sort((a,b) => b.total - a.total).forEach(p => {
        // COLUMNA BONIF AÑADIDA AQUÍ
        tbody.innerHTML += `<tr>
            <td class="text-start">${p.nombre}</td>
            <td>${p.bailes}</td>
            <td>${p.pts}</td>
            <td class="text-info">${p.bonif}</td>
            <td class="text-neon fw-bold">${p.total}</td>
        </tr>`;
    });
    updateSelectors();
}

function updateSelectors() {
    const pSelect = document.getElementById('playerSelect');
    pSelect.innerHTML = '<option value="" selected disabled>¿Quién bailó?</option>';
    players.forEach(p => {
        if(!usedPlayersInRound.has(p.nombre)) {
            pSelect.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`;
        }
    });

    const puestoSelect = document.getElementById('puestoSelect');
    Array.from(puestoSelect.options).forEach(opt => {
        if(opt.dataset.id) {
            opt.disabled = usedPuestos.has(opt.dataset.id);
        }
    });
}

function saveScore() {
    const name = document.getElementById('playerSelect').value;
    const puestoOpt = document.getElementById('puestoSelect').selectedOptions[0];
    const estrellas = parseInt(document.getElementById('estrellasSelect').value);

    if(!name || !puestoOpt.value) return alert("Selecciona jugador y puesto");

    const p = players.find(x => x.nombre === name);
    
    const registro = {
        nombre: name,
        puntosSumados: parseInt(puestoOpt.value),
        bonifSumada: estrellas,
        puestoID: puestoOpt.dataset.id
    };
    roundHistory.push(registro);

    p.bailes++;
    p.pts += registro.puntosSumados;
    p.bonif += registro.bonifSumada;
    p.total = p.pts + p.bonif;

    usedPlayersInRound.add(name);
    if(registro.puestoID !== "p4") usedPuestos.add(registro.puestoID);

    updateLeaderboard();
    document.getElementById('puestoSelect').value = "";
}

function undoLastScore() {
    if (roundHistory.length === 0) return;
    const ultimo = roundHistory.pop();
    const p = players.find(x => x.nombre === ultimo.nombre);
    p.bailes--;
    p.pts -= ultimo.puntosSumados;
    p.bonif -= ultimo.bonifSumada;
    p.total = p.pts + p.bonif;
    usedPlayersInRound.delete(ultimo.nombre);
    usedPuestos.delete(ultimo.puestoID);
    updateLeaderboard();
}

function resetRoundControls() {
    usedPuestos.clear();
    usedPlayersInRound.clear();
    roundHistory = [];
    updateSelectors();
}

function pickParticipants() {
    let pool = [...players].sort((a, b) => (a.bailes - b.bailes) || (a.total - b.total));
    const chosen = pool.slice(0, 4);
    const container = document.getElementById('nextMatch');
    container.innerHTML = chosen.map(p => `<span class="player-tag">${p.nombre}</span>`).join('');
}
</script>
</body>
</html>
