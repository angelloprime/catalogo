<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Dance Party - Ruleta & Puntos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        margin: 0;
        overflow-x: hidden;
        background: #050510;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #ffaa00;
        text-shadow: 0 0 15px rgba(255, 170, 0, 0.5);
    }

    .panel {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 20px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        height: 100%;
    }

    /* ESTILO TABLA */
    .table { color: white !important; margin-bottom: 0; }
    .table th { border-bottom: 2px solid #ffaa00; color: #ffaa00; }
    .table td { vertical-align: middle; border-bottom: 1px solid rgba(255,255,255,0.05); }

    .btn-warning { font-weight: bold; text-transform: uppercase; }

    .result-img {
        width: 100%;
        max-width: 350px;
        border-radius: 15px;
        box-shadow: 0 0 30px rgba(0,0,0,0.5), 0 0 20px rgba(255,170,0,0.2);
        margin-bottom: 15px;
    }

    /* OVERLAY Y ESCENA 3D */
    .overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle, rgba(20,20,40,0.98) 0%, rgba(0,0,0,1) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: 0.4s;
        z-index: 9999;
    }

    .overlay.active { opacity: 1; pointer-events: all; }

    .scene {
        width: 100%;
        height: 80vh;
        perspective: 2000px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .carousel {
        position: relative;
        width: 220px;
        height: 300px;
        transform-style: preserve-3d;
        transition: transform 12s cubic-bezier(0.1, 0.8, 0.2, 1);
    }

    /* CARTAS */
    .card {
        position: absolute;
        width: 220px;
        height: 300px;
        border-radius: 15px;
        overflow: hidden;
        background: #111;
        border: 2px solid rgba(255,255,255,0.2);
        backface-visibility: hidden; /* OCULTA LA PARTE DE ATRÁS */
    }

    .card img { width: 100%; height: 100%; object-fit: cover; }

    .card .title {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        padding: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: white; /* TEXTO EN BLANCO */
        text-align: center;
        font-size: 13px;
        font-weight: bold;
        text-shadow: 0 0 5px rgba(255,255,255,0.3);
    }

    .pointer {
        position: absolute;
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 60px;
        z-index: 10000;
        color: #ffaa00;
        text-shadow: 0 0 20px #ffaa00;
    }
</style>
</head>
<body>

<h1>🎡 Just Dance Party Roulette</h1>

<div class="container-fluid px-4 mt-3">
    <div class="row g-4">
        <!-- COLUMNA IZQUIERDA: CONTROLES Y JUGADORES -->
        <div class="col-lg-3">
            <div class="panel">
                <label class="form-label text-warning fw-bold">1. CONFIGURACIÓN</label>
                <select id="gameSelect" class="form-select bg-dark text-white border-secondary mb-3">
                    <option value="">Cargando juegos...</option>
                </select>
                
                <button class="btn btn-warning w-100 py-3 mb-4" onclick="spin()">
                    🚀 GIRAR RULETA
                </button>

                <label class="form-label text-warning fw-bold">2. COMPETIDORES</label>
                <div class="input-group mb-3">
                    <input type="text" id="playerName" class="form-control bg-dark text-white border-secondary" placeholder="Nombre...">
                    <button class="btn btn-outline-warning" onclick="addPlayer()">+</button>
                </div>

                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Jugador</th>
                                <th class="text-end">Puntos</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: RESULTADOS -->
        <div class="col-lg-9">
            <div class="panel text-center">
                <div id="resultContent">
                    <h2 id="songName" class="display-6 fw-bold text-warning">¡Listo para empezar!</h2>
                    <p id="artist" class="fs-4 text-secondary"></p>
                    
                    <img id="cover" class="result-img" src="portadas/default.webp">
                    
                    <audio id="audio" controls class="w-100 mt-2" style="max-width: 500px; margin: 0 auto; display: block;"></audio>

                    <!-- FORMULARIO DE PUNTOS -->
                    <div id="scoreForm" class="mt-4 p-3 border border-warning rounded-4 bg-dark" style="display:none; max-width: 600px; margin: 20px auto;">
                        <h4 class="text-warning">🏆 ¿Cuánto puntaje sacaste?</h4>
                        <div class="row g-2">
                            <div class="col-md-5">
                                <select id="playerSelect" class="form-select"></select>
                            </div>
                            <div class="col-md-4">
                                <input type="number" id="playerScore" class="form-control" placeholder="Ej: 11500">
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-success w-100" onclick="saveScore()">LISTO</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- OVERLAY DE LA RULETA -->
<div id="overlay" class="overlay">
    <div class="pointer">▼</div>
    <div class="scene">
        <div id="carousel" class="carousel"></div>
    </div>
</div>

<script>
let songs = [];
let filtered = [];
let history = [];
let players = [];
let currentRotation = 0;

// Carga inicial
fetch('canciones.json')
    .then(r => r.json())
    .then(data => {
        songs = data;
        const select = document.getElementById('gameSelect');
        const games = [...new Set(songs.map(s => s.juego))];
        select.innerHTML = '<option value="">Selecciona Just Dance...</option>';
        games.forEach(g => {
            let opt = document.createElement('option');
            opt.value = g; opt.textContent = g;
            select.appendChild(opt);
        });
    });

document.getElementById('gameSelect').addEventListener('change', e => {
    filtered = songs.filter(s => s.juego === e.target.value && s.portadaDisponible);
    history = [];
    createWheel();
});

function createWheel() {
    const carousel = document.getElementById('carousel');
    carousel.innerHTML = "";
    if(filtered.length === 0) return;

    const visibleCount = Math.min(filtered.length, 20);
    const list = filtered.slice(0, visibleCount);
    const angle = 360 / list.length;
    const radius = 900; // Radio amplio para vista frontal despejada

    list.forEach((song, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.transform = `rotateY(${i * angle}deg) translateZ(${radius}px)`;
        card.innerHTML = `
            <img src="portadas/${song.version}/${song.codigo}.webp" onerror="this.src='portadas/default.webp'">
            <div class="title">${song.cancion}</div>
        `;
        carousel.appendChild(card);
    });
}

function spin() {
    if(filtered.length === 0) return;
    
    const overlay = document.getElementById('overlay');
    const carousel = document.getElementById('carousel');
    overlay.classList.add('active');

    const visibleCount = Math.min(filtered.length, 20);
    const visibleSongs = filtered.slice(0, visibleCount);

    if(history.length >= visibleSongs.length) history = [];

    const available = visibleSongs.filter(s => !history.includes(s.codigo));
    const random = available[Math.floor(Math.random() * available.length)];
    history.push(random.codigo);

    const anglePerCard = 360 / visibleCount;
    const index = visibleSongs.indexOf(random);
    
    // Animación fluida hacia adelante
    const baseVueltas = Math.ceil(currentRotation / 360) * 360;
    const extraVueltas = 3600; 
    const targetAngle = index * anglePerCard;
    currentRotation = baseVueltas + extraVueltas + targetAngle;

    carousel.style.transform = `rotateY(${-currentRotation}deg)`;

    setTimeout(() => {
        showResult(random);
        overlay.classList.remove('active');
    }, 12000);
}

function showResult(song) {
    document.getElementById('songName').textContent = song.cancion;
    document.getElementById('artist').textContent = song.artista;
    document.getElementById('cover').src = `portadas/${song.version}/${song.codigo}.webp`;
    
    const audio = document.getElementById('audio');
    audio.src = `musica/${song.version}/${song.codigo}.ogg`;
    audio.play().catch(()=>{});

    if(players.length > 0) {
        document.getElementById('scoreForm').style.display = 'block';
    }
}

// LÓGICA DE JUGADORES
function addPlayer() {
    const nameInput = document.getElementById('playerName');
    const name = nameInput.value.trim();
    if (name && !players.find(p => p.nombre === name)) {
        players.push({ nombre: name, puntos: 0 });
        nameInput.value = "";
        updateLeaderboard();
    }
}

function updateLeaderboard() {
    const tbody = document.getElementById('leaderboardBody');
    const select = document.getElementById('playerSelect');
    tbody.innerHTML = "";
    select.innerHTML = '<option value="">¿Quién bailó?</option>';
    
    players.sort((a, b) => b.puntos - a.puntos);
    players.forEach(p => {
        tbody.innerHTML += `<tr><td>${p.nombre}</td><td class="text-end fw-bold text-warning">${p.puntos.toLocaleString()}</td></tr>`;
        select.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`;
    });
}

function saveScore() {
    const playerName = document.getElementById('playerSelect').value;
    const scoreVal = parseInt(document.getElementById('playerScore').value);
    
    if (playerName && !isNaN(scoreVal)) {
        const player = players.find(p => p.nombre === playerName);
        player.puntos += scoreVal;
        document.getElementById('scoreForm').style.display = 'none';
        document.getElementById('playerScore').value = '';
        updateLeaderboard();
    }
}
</script>
</body>
</html>
