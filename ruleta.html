<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Dance PRO - Legend Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary-neon: #00f2ff; --secondary-neon: #bc00ff; --bg-dark: #050510; --panel-bg: rgba(20, 20, 40, 0.8); }
        body { background: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        h1 { text-align: center; margin: 20px 0; font-weight: 800; color: var(--primary-neon); text-shadow: 0 0 15px var(--primary-neon); }
        
        .panel { background: var(--panel-bg); border-radius: 20px; padding: 20px; backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.2); height: 100%; }
        .text-neon { color: var(--primary-neon); text-shadow: 0 0 5px var(--primary-neon); }
        
        .table { color: white !important; font-size: 0.85rem; }
        .table th { border-bottom: 2px solid var(--secondary-neon); color: var(--secondary-neon); text-align: center; }
        .table td { border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; vertical-align: middle; }

        .rango-tag { font-size: 0.7rem; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; display: block; margin-top: 2px; font-weight: bold; }
        .rango-amateur { background: #6c757d; color: white; }
        .rango-dancer { background: #198754; color: white; }
        .rango-star { background: #0dcaf0; color: black; }
        .rango-legend { background: #ffc107; color: black; box-shadow: 0 0 10px #ffc107; }

        .btn-neon { background: transparent; border: 2px solid var(--primary-neon); color: var(--primary-neon); font-weight: bold; transition: 0.3s; }
        .btn-neon:hover:not(:disabled) { background: var(--primary-neon); color: black; box-shadow: 0 0 20px var(--primary-neon); }
        
        /* RULETA */
        .overlay { position: fixed; inset: 0; background: radial-gradient(circle, #1a0033 0%, #000 100%); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.4s; z-index: 9999; }
        .overlay.active { opacity: 1; pointer-events: all; }
        .scene { width: 300px; height: 400px; perspective: 2000px; display: flex; justify-content: center; align-items: center; }
        .carousel { position: relative; width: 220px; height: 300px; transform-style: preserve-3d; transition: transform 10s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .card { position: absolute; width: 220px; height: 300px; border-radius: 15px; border: 3px solid var(--primary-neon); backface-visibility: hidden; background: #000; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .pointer { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); font-size: 80px; z-index: 10001; color: #ff0044; }

        .player-tag { display: inline-block; background: var(--secondary-neon); color: white; padding: 4px 12px; border-radius: 8px; margin: 3px; font-weight: bold; }
        canvas { max-height: 180px; margin-top: 15px; }
    </style>
</head>
<body>

<h1>🎡 Just Dance PRO Championship</h1>

<div class="container-fluid px-4">
    <div class="row g-3">
        <!-- IZQUIERDA: RANKING -->
        <div class="col-lg-4">
            <div class="panel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="text-neon m-0">🏆 RANKING & RANGOS</h6>
                    <button class="btn btn-sm btn-outline-danger" onclick="clearTournament()">Reset</button>
                </div>
                
                <div class="input-group mb-3">
                    <input type="text" id="playerName" class="form-control bg-dark text-white border-secondary" placeholder="Nombre...">
                    <button class="btn btn-neon" onclick="addPlayer()">+</button>
                </div>

                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr><th>P</th><th class="text-start">Jugador</th><th>💃</th><th>Pts</th><th class="text-neon">Total</th></tr>
                        </thead>
                        <tbody id="leaderboardBody"></tbody>
                    </table>
                </div>

                <canvas id="scoreChart"></canvas>

                <div id="selectionPanel" class="mt-4" style="display:none;">
                    <button class="btn btn-sm btn-outline-info w-100 mb-2" onclick="pickParticipants()">EQUILIBRAR PRÓXIMA RONDA</button>
                    <div id="nextMatch" class="p-2 border border-info rounded text-center bg-black bg-opacity-25"></div>
                    <button id="btnSuddenDeath" class="btn btn-danger w-100 mt-2" style="display:none" onclick="suddenDeath()">⚡ MUERTE SÚBITA</button>
                </div>
            </div>
        </div>

        <!-- DERECHA: RULETA -->
        <div class="col-lg-8">
            <div class="panel">
                <div class="row mb-3">
                    <div class="col-md-8">
                        <select id="gameSelect" class="form-select bg-dark text-white border-secondary"></select>
                    </div>
                    <div class="col-md-4 text-end">
                        <span id="songCount" class="badge bg-primary px-3 py-2"></span>
                    </div>
                </div>

                <button id="btnSpin" class="btn btn-neon w-100 py-3 mb-4" onclick="spin()" disabled>🎡 GIRAR RULETA</button>

                <div class="text-center">
                    <h2 id="songName" class="text-neon fw-bold">Selecciona un juego</h2>
                    <p id="songDiff" class="text-secondary"></p>
                    <img id="cover" class="rounded-4 shadow-lg mb-3" src="portadas/default.webp" style="max-height: 250px;">
                    <audio id="audio" controls class="w-100" style="max-width: 500px; margin: auto;"></audio>
                </div>

                <!-- PUNTOS -->
                <div id="scoreForm" class="mt-4 p-3 rounded-4 border border-secondary" style="display:none; background: rgba(0,0,0,0.5);">
                    <div class="d-flex justify-content-between mb-3">
                        <h6 class="text-info m-0">⭐ ASIGNAR PUNTOS</h6>
                        <div>
                            <button class="btn btn-sm btn-warning me-2" onclick="undoLastScore()">Deshacer</button>
                            <button class="btn btn-sm btn-danger" onclick="resetRoundControls()">Siguiente Canción</button>
                        </div>
                    </div>
                    <div class="row g-2">
                        <div class="col-md-4"><select id="playerSelect" class="form-select bg-dark text-white border-info"></select></div>
                        <div class="col-md-3">
                            <select id="puestoSelect" class="form-select bg-dark text-white border-info">
                                <option value="" selected disabled>Puesto...</option>
                                <option value="5" data-id="p1">1° (+5)</option>
                                <option value="4" data-id="p2">2° (+4)</option>
                                <option value="2" data-id="p3">3° (+2)</option>
                                <option value="1" data-id="p4">4°+ (+1)</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select id="estrellasSelect" class="form-select bg-dark text-white border-info">
                                <option value="3">5⭐ (+3)</option>
                                <option value="2">4⭐ (+2)</option>
                                <option value="1">3⭐ (+1)</option>
                                <option value="0">2⭐- (+0)</option>
                            </select>
                        </div>
                        <div class="col-md-2"><button class="btn btn-success w-100" onclick="saveScore()">Ok</button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- RULETA -->
<div id="overlay" class="overlay">
    <div class="pointer">▼</div>
    <div class="scene"><div id="carousel" class="carousel"></div></div>
</div>

<script>
let songs = [], filtered = [], history = [], players = [];
let currentRotation = 0, chart = null;
let usedPuestos = new Set(), usedPlayersInRound = new Set(), roundHistory = [];

const sfxTick = new Audio('https://www.soundjay.com/buttons/button-50.mp3');
const sfxWin = new Audio('https://www.soundjay.com/human/applause-01.mp3');

window.onload = () => {
    const saved = localStorage.getItem('jdTournament');
    if(saved) {
        players = JSON.parse(saved);
        updateLeaderboard();
        if(players.length > 4) document.getElementById('selectionPanel').style.display = 'block';
    }
    
    fetch('canciones.json').then(r => r.json()).then(data => {
        songs = data;
        const select = document.getElementById('gameSelect');
        const games = [...new Set(songs.map(s => s.juego))];
        select.innerHTML = '<option value="">Elige un Just Dance...</option>';
        games.forEach(g => { select.innerHTML += `<option value="${g}">${g}</option>`; });
    });
};

function getRango(pts) {
    if (pts < 15) return { txt: "Amateur", cl: "rango-amateur" };
    if (pts < 40) return { txt: "Dancer", cl: "rango-dancer" };
    if (pts < 80) return { txt: "SuperStar", cl: "rango-star" };
    return { txt: "Legend", cl: "rango-legend" };
}

function updateLeaderboard() {
    const tbody = document.getElementById('leaderboardBody');
    tbody.innerHTML = "";
    players.sort((a,b) => b.total - a.total).forEach((p, i) => {
        let medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
        let rango = getRango(p.total);
        tbody.innerHTML += `<tr>
            <td>${medal}</td>
            <td class="text-start">${p.nombre}<span class="rango-tag ${rango.cl}">${rango.txt}</span></td>
            <td>${p.bailes}</td>
            <td>${p.pts}</td>
            <td class="text-neon fw-bold">${p.total}</td>
        </tr>`;
    });
    
    if(players.length >= 2 && players[0].total === players[1].total && players[0].total > 0) {
        document.getElementById('btnSuddenDeath').style.display = 'block';
    } else {
        document.getElementById('btnSuddenDeath').style.display = 'none';
    }

    if (chart) chart.destroy();
    const ctx = document.getElementById('scoreChart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: players.map(p => p.nombre),
            datasets: [{ data: players.map(p => p.total), backgroundColor: '#bc00ff', borderColor: '#00f2ff', borderWidth: 1 }]
        },
        options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { color: 'white' } }, y: { ticks: { color: 'white' } } } }
    });

    updateSelectors();
    localStorage.setItem('jdTournament', JSON.stringify(players));
}

function addPlayer() {
    const name = document.getElementById('playerName').value.trim();
    if(name && !players.find(p => p.nombre === name)) {
        players.push({ nombre: name, bailes: 0, pts: 0, bonif: 0, total: 0 });
        document.getElementById('playerName').value = "";
        updateLeaderboard();
        document.getElementById('selectionPanel').style.display = players.length > 4 ? 'block' : 'none';
    }
}

function saveScore() {
    const name = document.getElementById('playerSelect').value;
    const puestoOpt = document.getElementById('puestoSelect').selectedOptions[0];
    if(!name || !puestoOpt.value) return;

    const p = players.find(x => x.nombre === name);
    const reg = { nombre: name, pts: parseInt(puestoOpt.value), bon: parseInt(document.getElementById('estrellasSelect').value), pid: puestoOpt.dataset.id };
    
    roundHistory.push(reg);
    p.bailes++; p.pts += reg.pts; p.bonif += reg.bon; p.total = p.pts + p.bonif;
    
    // PUNTO 2: Confeti si es buen puntaje
    if(reg.pts >= 4 || reg.bon === 3) {
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#00f2ff', '#bc00ff', '#ffffff'] });
    }

    usedPlayersInRound.add(name);
    if(reg.pid !== "p4") usedPuestos.add(reg.pid);
    updateLeaderboard();
}

function spin() {
    const available = filtered.filter(s => !history.includes(s.codigo));
    const songToPick = (available.length ? available : filtered)[Math.floor(Math.random() * (available.length || filtered.length))];
    const visibleList = filtered.slice(0, 20);
    let targetIndex = visibleList.findIndex(s => s.codigo === songToPick.codigo);

    if(targetIndex === -1) {
        targetIndex = 0;
        document.querySelectorAll('.card')[0].innerHTML = `<img src="portadas/${songToPick.version}/${songToPick.codigo}.webp">`;
    }

    document.getElementById('overlay').classList.add('active');
    const tickInterval = setInterval(() => sfxTick.play(), 250);

    const anglePerCard = 360 / visibleList.length;
    currentRotation = (Math.ceil(currentRotation / 360) * 360) + (10 * 360) - (targetIndex * anglePerCard);
    document.getElementById('carousel').style.transform = `rotateY(${currentRotation}deg)`;

    setTimeout(() => {
        clearInterval(tickInterval);
        sfxWin.play();
        showResult(songToPick);
        history.push(songToPick.codigo);
        document.getElementById('overlay').classList.remove('active');
        resetRoundControls();
    }, 10500);
}

function showResult(song) {
    document.getElementById('songName').textContent = song.cancion;
    document.getElementById('songDiff').textContent = `Dificultad: ${"🔥".repeat(song.dificultad)}`;
    document.getElementById('cover').src = `portadas/${song.version}/${song.codigo}.webp`;
    document.getElementById('audio').src = `musica/${song.version}/${song.codigo}.ogg`;
    document.getElementById('audio').play().catch(()=>{});
    if(players.length) document.getElementById('scoreForm').style.display = 'block';
}

function undoLastScore() {
    if(!roundHistory.length) return;
    const u = roundHistory.pop();
    const p = players.find(x => x.nombre === u.nombre);
    p.bailes--; p.pts -= u.pts; p.bonif -= u.bon; p.total = p.pts + p.bonif;
    usedPlayersInRound.delete(u.nombre); usedPuestos.delete(u.pid);
    updateLeaderboard();
}

function resetRoundControls() {
    usedPuestos.clear(); usedPlayersInRound.clear(); roundHistory = []; updateSelectors();
}

function clearTournament() {
    if(confirm("¿Reiniciar torneo?")) { localStorage.removeItem('jdTournament'); location.reload(); }
}

function pickParticipants() {
    let pool = [...players].sort((a, b) => a.bailes - b.bailes);
    document.getElementById('nextMatch').innerHTML = pool.slice(0, 4).map(p => `<span class="player-tag">${p.nombre}</span>`).join('');
}

function suddenDeath() {
    const hardSongs = filtered.filter(s => s.dificultad == 4);
    showResult(hardSongs.length ? hardSongs[Math.floor(Math.random()*hardSongs.length)] : filtered[0]);
}

document.getElementById('gameSelect').addEventListener('change', e => {
    filtered = songs.filter(s => s.juego === e.target.value && s.portadaDisponible);
    document.getElementById('songCount').textContent = `Cant: ${filtered.length}`;
    document.getElementById('btnSpin').disabled = !e.target.value;
    if(e.target.value) {
        const carousel = document.getElementById('carousel');
        carousel.innerHTML = "";
        const list = filtered.slice(0, 20);
        const angle = 360 / list.length;
        list.forEach((s, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.transform = `rotateY(${i * angle}deg) translateZ(800px)`;
            card.innerHTML = `<img src="portadas/${s.version}/${s.codigo}.webp" onerror="this.src='portadas/default.webp'">`;
            carousel.appendChild(card);
        });
    }
});

function updateSelectors() {
    const pSelect = document.getElementById('playerSelect');
    pSelect.innerHTML = '<option value="" selected disabled>¿Quién bailó?</option>';
    players.forEach(p => {
        if(!usedPlayersInRound.has(p.nombre)) pSelect.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`;
    });
    Array.from(document.getElementById('puestoSelect').options).forEach(opt => {
        if(opt.dataset.id) opt.disabled = usedPuestos.has(opt.dataset.id);
    });
}
</script>
</body>
</html>
