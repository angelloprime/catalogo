<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Dance Championship - Neon Edition</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    :root {
        --primary-neon: #00f2ff; /* Cyan */
        --secondary-neon: #bc00ff; /* Violeta */
        --bg-dark: #050510;
        --panel-bg: rgba(20, 20, 40, 0.7);
    }

    body {
        margin: 0;
        overflow-x: hidden;
        background: var(--bg-dark);
        color: white;
        font-family: 'Segoe UI', Roboto, sans-serif;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--primary-neon);
        text-shadow: 0 0 15px var(--primary-neon);
    }

    .panel {
        background: var(--panel-bg);
        border-radius: 20px;
        padding: 20px;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(0, 242, 255, 0.2);
        height: 100%;
    }

    .text-neon { color: var(--primary-neon); text-shadow: 0 0 5px var(--primary-neon); }
    .text-violet { color: var(--secondary-neon); }

    /* ESTILO TABLA */
    .table { color: white !important; margin-top: 10px; }
    .table th { border-bottom: 2px solid var(--secondary-neon); color: var(--secondary-neon); text-transform: uppercase; font-size: 0.8rem; text-align: center; }
    .table td { vertical-align: middle; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; padding: 10px 5px; }

    .btn-neon {
        background: transparent;
        border: 2px solid var(--primary-neon);
        color: var(--primary-neon);
        font-weight: bold;
        transition: 0.3s;
    }
    .btn-neon:hover {
        background: var(--primary-neon);
        color: black;
        box-shadow: 0 0 20px var(--primary-neon);
    }

    .song-count-badge {
        background: var(--secondary-neon);
        color: white;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        display: inline-block;
        margin-bottom: 10px;
    }

    /* RULETA */
    .overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle, rgba(15,0,30,0.98) 0%, rgba(0,0,0,1) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: 0.4s;
        z-index: 9999;
    }
    .overlay.active { opacity: 1; pointer-events: all; }
    .scene { width: 100%; height: 80vh; perspective: 2000px; display: flex; justify-content: center; align-items: center; }
    .carousel { position: relative; width: 220px; height: 300px; transform-style: preserve-3d; transition: transform 12s cubic-bezier(0.1, 0.8, 0.2, 1); }
    .card { position: absolute; width: 220px; height: 300px; border-radius: 15px; overflow: hidden; background: #000; border: 2px solid var(--primary-neon); backface-visibility: hidden; }
    .card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
    .card .title { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; background: rgba(0, 0, 0, 0.85); color: white; text-align: center; font-size: 12px; font-weight: bold; border-top: 1px solid var(--primary-neon); }
    .pointer { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); font-size: 60px; z-index: 10000; color: var(--primary-neon); text-shadow: 0 0 20px var(--primary-neon); }
</style>
</head>
<body>

<h1>🎡 Just Dance Championship</h1>

<div class="container-fluid px-4 mt-3">
    <div class="row g-4">
        <!-- IZQUIERDA: REGISTRO Y TABLA -->
        <div class="col-lg-5">
            <div class="panel mb-4">
                <h5 class="text-neon mb-3">👤 1. REGISTRAR JUGADORES</h5>
                <div class="input-group mb-3">
                    <input type="text" id="playerName" class="form-control bg-dark text-white border-secondary" placeholder="Nombre del amigo...">
                    <button class="btn btn-neon" onclick="addPlayer()">+ Añadir</button>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th class="text-start">Nombre</th>
                                <th>Bailes</th>
                                <th>Pts</th>
                                <th>Bonif</th>
                                <th class="text-neon">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- DERECHA: RULETA Y RESULTADOS -->
        <div class="col-lg-7">
            <div class="panel">
                <h5 class="text-neon mb-3">🎮 2. SELECCIÓN Y RULETA</h5>
                
                <div class="row mb-3">
                    <div class="col-md-7">
                        <select id="gameSelect" class="form-select bg-dark text-white border-secondary"></select>
                    </div>
                    <div class="col-md-5 text-end">
                        <div id="songCountContainer" style="display:none;">
                            <span class="song-count-badge"> canciones: <span id="songCount">0</span></span>
                        </div>
                    </div>
                </div>

                <button id="btnSpin" class="btn btn-neon w-100 py-3 mb-4" onclick="spin()" disabled>
                    🎡 GIRAR PARA ELEGIR CANCIÓN
                </button>

                <div class="text-center" id="resultDisplay">
                    <h2 id="songName" class="text-neon fw-bold">Esperando juego...</h2>
                    <p id="artist" class="text-secondary"></p>
                    <img id="cover" class="result-img" src="portadas/default.webp" style="max-width: 250px; border-radius: 15px;">
                    <audio id="audio" controls class="w-100 mt-3" style="max-width: 400px; margin: 15px auto;"></audio>
                </div>

                <!-- FORMULARIO DE PUNTOS -->
                <div id="scoreForm" class="mt-4 p-3 rounded-4" style="display:none; background: rgba(0,0,0,0.4); border: 1px solid var(--secondary-neon);">
                    <h6 class="text-violet mb-3">⭐ ASIGNAR PUNTOS DE LA RONDA</h6>
                    <div class="row g-2 align-items-end">
                        <div class="col-md-4">
                            <select id="playerSelect" class="form-select bg-dark text-white"></select>
                        </div>
                        <div class="col-md-3">
                            <select id="puestoSelect" class="form-select bg-dark text-white">
                                <option value="5">1° Lugar (+5)</option>
                                <option value="4">2° Lugar (+4)</option>
                                <option value="2">3° Lugar (+2)</option>
                                <option value="1">4° o más (+1)</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select id="estrellasSelect" class="form-select bg-dark text-white">
                                <option value="3">5 Estrellas (+3)</option>
                                <option value="2">4 Estrellas (+2)</option>
                                <option value="1">3 Estrellas (+1)</option>
                                <option value="0">2 o menos (+0)</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-success w-100" onclick="saveScore()">Ok</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="overlay" class="overlay">
    <div class="pointer">▼</div>
    <div class="scene"><div id="carousel" class="carousel"></div></div>
</div>

<script>
let songs = [];
let filtered = [];
let history = [];
let players = [];
let currentRotation = 0;

fetch('canciones.json').then(r => r.json()).then(data => {
    songs = data;
    const select = document.getElementById('gameSelect');
    const games = [...new Set(songs.map(s => s.juego))];
    select.innerHTML = '<option value="">Elige un Just Dance...</option>';
    games.forEach(g => {
        let opt = document.createElement('option');
        opt.value = g; opt.textContent = g;
        select.appendChild(opt);
    });
});

document.getElementById('gameSelect').addEventListener('change', e => {
    filtered = songs.filter(s => s.juego === e.target.value && s.portadaDisponible);
    history = [];
    
    const countContainer = document.getElementById('songCountContainer');
    const countSpan = document.getElementById('songCount');
    const btnSpin = document.getElementById('btnSpin');

    if(e.target.value) {
        countContainer.style.display = 'inline-block';
        countSpan.textContent = filtered.length;
        btnSpin.disabled = false;
        createWheel();
    } else {
        countContainer.style.display = 'none';
        btnSpin.disabled = true;
    }
});

function createWheel() {
    const carousel = document.getElementById('carousel');
    carousel.innerHTML = "";
    if(filtered.length === 0) return;
    const visibleCount = Math.min(filtered.length, 20);
    const list = filtered.slice(0, visibleCount);
    const angle = 360 / list.length;
    const radius = 900;

    list.forEach((song, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.transform = `rotateY(${i * angle}deg) translateZ(${radius}px)`;
        card.innerHTML = `<img src="portadas/${song.version}/${song.codigo}.webp" onerror="this.src='portadas/default.webp'"><div class="title">${song.cancion}</div>`;
        carousel.appendChild(card);
    });
}

function spin() {
    if(filtered.length === 0) return;
    const overlay = document.getElementById('overlay');
    const carousel = document.getElementById('carousel');
    overlay.classList.add('active');

    const visibleCount = Math.min(filtered.length, 20);
    const visibleSongs = filtered.slice(0, visibleCount);
    if(history.length >= visibleSongs.length) history = [];
    
    const available = visibleSongs.filter(s => !history.includes(s.codigo));
    const random = available[Math.floor(Math.random() * available.length)];
    history.push(random.codigo);

    const anglePerCard = 360 / visibleCount;
    const index = visibleSongs.indexOf(random);
    const baseVueltas = Math.ceil(currentRotation / 360) * 360;
    currentRotation = baseVueltas + 3600 + (index * anglePerCard);

    carousel.style.transform = `rotateY(${-currentRotation}deg)`;

    setTimeout(() => {
        showResult(random);
        overlay.classList.remove('active');
    }, 12000);
}

function showResult(song) {
    document.getElementById('songName').textContent = song.cancion;
    document.getElementById('artist').textContent = song.artista;
    document.getElementById('cover').src = `portadas/${song.version}/${song.codigo}.webp`;
    document.getElementById('audio').src = `musica/${song.version}/${song.codigo}.ogg`;
    document.getElementById('audio').play().catch(()=>{});
    if(players.length > 0) document.getElementById('scoreForm').style.display = 'block';
}

function addPlayer() {
    const input = document.getElementById('playerName');
    const name = input.value.trim();
    if(name && !players.find(p => p.nombre === name)) {
        players.push({ nombre: name, bailes: 0, ptsPuesto: 0, bonif: 0, total: 0 });
        input.value = "";
        updateLeaderboard();
    }
}

function updateLeaderboard() {
    const tbody = document.getElementById('leaderboardBody');
    const select = document.getElementById('playerSelect');
    tbody.innerHTML = "";
    select.innerHTML = '<option value="">¿Quién bailó?</option>';
    players.sort((a,b) => b.total - a.total).forEach(p => {
        tbody.innerHTML += `<tr><td class="text-start">${p.nombre}</td><td>${p.bailes}</td><td>${p.ptsPuesto}</td><td>${p.bonif}</td><td class="fw-bold text-neon">${p.total}</td></tr>`;
        select.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`;
    });
}

function saveScore() {
    const pName = document.getElementById('playerSelect').value;
    const pPuesto = parseInt(document.getElementById('puestoSelect').value);
    const pEstrellas = parseInt(document.getElementById('estrellasSelect').value);
    if(pName) {
        const p = players.find(x => x.nombre === pName);
        p.bailes++; p.ptsPuesto += pPuesto; p.bonif += pEstrellas; p.total = p.ptsPuesto + p.bonif;
        updateLeaderboard();
        alert(`Puntos cargados a ${pName}`);
    }
}
</script>
</body>
</html>
