<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta 3D Just Dance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(circle at top,#252547,#0d0d16);

  color:white;
  overflow-x:hidden;
  font-family:Arial,sans-serif;
}

h1{
  text-align:center;
  margin-top:20px;
  font-weight:bold;
}

.main-container{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.panel{
  background:rgba(255,255,255,0.05);
  border-radius:25px;
  padding:25px;
  backdrop-filter:blur(10px);
}

/* BOTONES */

.btn-girar{
  font-size:20px;
  padding:14px 30px;
  border-radius:15px;
  font-weight:bold;
}

/* RESULTADO */

.portada-resultado{
  width:300px;
  max-width:100%;
  border-radius:20px;

  box-shadow:
    0 0 20px rgba(255,255,255,0.2),
    0 0 50px rgba(255,152,0,0.2);

  transition:0.3s;
}

.portada-resultado:hover{
  transform:scale(1.03);
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,0.92);

  backdrop-filter:blur(10px);

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:9999;

  opacity:0;
  pointer-events:none;

  transition:0.4s;
}

.overlay.activo{
  opacity:1;
  pointer-events:all;
}

/* ESCENA 3D */

.scene{
  width:700px;
  height:700px;

  perspective:1600px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* RULETA 3D */

.carousel3d{
  position:relative;

  width:420px;
  height:420px;

  transform-style:preserve-3d;

  transition:
    transform 6s cubic-bezier(0.1,0.7,0.1,1);
}

/* CARTAS */

.card3d{
  position:absolute;

  width:180px;
  height:240px;

  left:120px;
  top:90px;

  border-radius:20px;

  overflow:hidden;

  background:#222;

  box-shadow:
    0 0 20px rgba(255,255,255,0.15);

  border:3px solid rgba(255,255,255,0.15);

  transform-style:preserve-3d;
}

.card3d img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card3d .titulo{
  position:absolute;

  bottom:0;
  left:0;
  right:0;

  background:rgba(0,0,0,0.7);

  font-size:12px;
  text-align:center;

  padding:8px;
}

/* FLECHA */

.flecha{
  position:absolute;

  top:40px;
  left:50%;

  transform:translateX(-50%);

  font-size:70px;

  z-index:20;

  text-shadow:
    0 0 20px white,
    0 0 40px orange;
}

/* GLOW */

@keyframes pulse{

  0%{
    filter:drop-shadow(0 0 10px orange);
  }

  50%{
    filter:drop-shadow(0 0 30px white);
  }

  100%{
    filter:drop-shadow(0 0 10px orange);
  }

}

.girando{
  animation:pulse 1s infinite;
}

/* RESPONSIVE */

@media(max-width:768px){

  .scene{
    width:100vw;
    height:100vw;
  }

  .carousel3d{
    transform:scale(0.7);
  }

}

</style>
</head>
<body>

<h1>🎡 Ruleta 3D Just Dance</h1>

<div class="main-container">

  <div class="row g-4 align-items-center">

    <!-- IZQUIERDA -->

    <div class="col-lg-4">

      <div class="panel text-center">

        <select id="selectorJuego" class="form-select mb-4">
          <option value="">Selecciona un juego</option>
        </select>

        <button
          class="btn btn-warning btn-girar"
          onclick="girar()">
          🎡 GIRAR
        </button>

      </div>

    </div>

    <!-- DERECHA -->

    <div class="col-lg-8">

      <div class="panel text-center">

        <h2 id="nombre">
          🎶 Esperando canción...
        </h2>

        <p id="artista"></p>

        <img
          id="portadaResultado"
          class="portada-resultado mt-3"
          src="portadas/default.webp">

        <audio
          id="player"
          controls
          class="w-100 mt-4">
        </audio>

        <div class="mt-4">
          <strong>Historial:</strong>
          <span id="historialCount">0</span>
        </div>

      </div>

    </div>

  </div>

</div>

<!-- OVERLAY -->

<div id="overlay" class="overlay">

  <div class="flecha">▼</div>

  <div class="scene">

    <div id="carousel3d" class="carousel3d"></div>

  </div>

</div>

<script>

let canciones = [];
let filtradas = [];
let historial = [];

let rotacionActual = 0;

/* CARGAR JSON */

fetch('canciones.json')
.then(r => r.json())
.then(data => {

  canciones = data;

  cargarJuegos();

});

/* CARGAR JUEGOS */

function cargarJuegos(){

  const selector =
    document.getElementById('selectorJuego');

  const juegos =
    [...new Set(canciones.map(c => c.juego))];

  juegos.forEach(j => {

    const opt = document.createElement('option');

    opt.value = j;
    opt.textContent = j;

    selector.appendChild(opt);

  });

}

/* CAMBIAR JUEGO */

document
.getElementById('selectorJuego')
.addEventListener('change', e => {

  filtradas = canciones.filter(c =>
    c.juego === e.target.value &&
    c.portadaDisponible
  );

  historial = [];

  crearCarrusel3D();

});

/* CREAR RULETA 3D */

function crearCarrusel3D(){

  const carousel =
    document.getElementById('carousel3d');

  carousel.innerHTML = "";

  if(filtradas.length === 0) return;

  const cantidadVisual =
    Math.min(filtradas.length,20);

  const lista =
    filtradas.slice(0,cantidadVisual);

  const angulo =
    360 / lista.length;

  const radio = 320;

  lista.forEach((c,i) => {

    const card =
      document.createElement('div');

    card.className = 'card3d';

    card.style.transform = `
      rotateY(${i * angulo}deg)
      translateZ(${radio}px)
    `;

    card.innerHTML = `

      <img
        src="portadas/${c.version}/${c.codigo}.webp"
        onerror="this.src='portadas/default.webp'">

      <div class="titulo">
        ${c.cancion}
      </div>

    `;

    carousel.appendChild(card);

  });

}

/* GIRAR */

function girar(){

  if(filtradas.length === 0) return;

  const overlay =
    document.getElementById('overlay');

  const carousel =
    document.getElementById('carousel3d');

  overlay.classList.add('activo');

  if(historial.length === filtradas.length){

    historial = [];

  }

  const disponibles =
    filtradas.filter(c =>
      !historial.includes(c.codigo)
    );

  const random =
    disponibles[
      Math.floor(Math.random() * disponibles.length)
    ];

  historial.push(random.codigo);

  document.getElementById(
    'historialCount'
  ).textContent = historial.length;

  const index =
    filtradas.indexOf(random);

  const angulo =
    360 / Math.min(filtradas.length,20);

  const grados =
    3600 + (index * angulo);

  rotacionActual += grados;

  carousel.classList.add('girando');

  carousel.style.transform = `
    rotateX(-10deg)
    rotateY(${-rotacionActual}deg)
  `;

  setTimeout(() => {

    carousel.classList.remove('girando');

    mostrarResultado(random);

  },6000);

  setTimeout(() => {

    overlay.classList.remove('activo');

  },6800);

}

/* MOSTRAR RESULTADO */

function mostrarResultado(c){

  document.getElementById(
    'nombre'
  ).textContent = c.cancion;

  document.getElementById(
    'artista'
  ).textContent = c.artista;

  const portada =
    document.getElementById('portadaResultado');

  portada.src =
    `portadas/${c.version}/${c.codigo}.webp`;

  portada.onerror = () => {

    portada.src =
      'portadas/default.webp';

  };

  const player =
    document.getElementById('player');

  player.src =
    `musica/${c.version}/${c.codigo}.ogg`;

  player.play().catch(()=>{});

}

</script>

</body>
</html>
