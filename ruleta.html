<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Dance Party - Sistema de Puntos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        margin: 0;
        overflow-x: hidden;
        background: #050510;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
        font-weight: bold;
        text-transform: uppercase;
        color: #ffaa00;
        text-shadow: 0 0 15px rgba(255, 170, 0, 0.5);
    }

    .panel {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 20px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        height: 100%;
    }

    .table { color: white !important; font-size: 0.9rem; }
    .table th { border-bottom: 2px solid #ffaa00; color: #ffaa00; text-align: center; }
    .table td { vertical-align: middle; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }

    .btn-warning { font-weight: bold; text-transform: uppercase; }

    .result-img {
        width: 100%;
        max-width: 320px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(255,170,0,0.2);
        margin-bottom: 15px;
    }

    /* OVERLAY Y RULETA */
    .overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle, rgba(20,20,40,0.98) 0%, rgba(0,0,0,1) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: 0.4s;
        z-index: 9999;
    }

    .overlay.active { opacity: 1; pointer-events: all; }

    .scene {
        width: 100%;
        height: 80vh;
        perspective: 2000px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .carousel {
        position: relative;
        width: 220px;
        height: 300px;
        transform-style: preserve-3d;
        transition: transform 12s cubic-bezier(0.1, 0.8, 0.2, 1);
    }

    .card {
        position: absolute;
        width: 220px;
        height: 300px;
        border-radius: 15px;
        overflow: hidden;
        background: #111;
        border: 2px solid rgba(255,255,255,0.2);
        backface-visibility: hidden;
    }

    .card img { width: 100%; height: 100%; object-fit: cover; }

    .card .title {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        padding: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        text-align: center;
        font-size: 12px;
        font-weight: bold;
    }

    .pointer {
        position: absolute;
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 60px;
        z-index: 10000;
        color: #ffaa00;
    }
</style>
</head>
<body>

<h1>🎡 Just Dance Championship</h1>

<div class="container-fluid px-4 mt-3">
    <div class="row g-4">
        <!-- COLUMNA IZQUIERDA: CONTROLES Y TABLA -->
        <div class="col-lg-5">
            <div class="panel">
                <div class="mb-4">
                    <label class="form-label text-warning fw-bold">CONFIGURACIÓN</label>
                    <select id="gameSelect" class="form-select bg-dark text-white border-secondary mb-2">
                        <option value="">Cargando juegos...</option>
                    </select>
                    <button class="btn btn-warning w-100 py-2" onclick="spin()">🚀 GIRAR RULETA</button>
                </div>

                <label class="form-label text-warning fw-bold">JUGADORES</label>
                <div class="input-group mb-3">
                    <input type="text" id="playerName" class="form-control bg-dark text-white border-secondary" placeholder="Nuevo jugador...">
                    <button class="btn btn-outline-warning" onclick="addPlayer()">Añadir</button>
                </div>

                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th class="text-start">Nombre</th>
                                <th>Bailes</th>
                                <th>Puntos</th>
                                <th>Bonif.</th>
                                <th class="text-warning">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: RESULTADOS Y PUNTAJE -->
        <div class="col-lg-7">
            <div class="panel text-center">
                <h2 id="songName" class="display-6 fw-bold text-warning">¡A bailar!</h2>
                <p id="artist" class="fs-5 text-secondary"></p>
                <img id="cover" class="result-img" src="portadas/default.webp">
                <audio id="audio" controls class="w-100 mb-3" style="max-width: 400px; margin: 0 auto;"></audio>

                <!-- NUEVO FORMULARIO DE PUNTOS -->
                <div id="scoreForm" class="mt-2 p-3 border border-warning rounded-4 bg-dark" style="display:none;">
                    <h5 class="text-warning mb-3">Registrar Resultados de la Ronda</h5>
                    <div class="row g-2 align-items-end">
                        <div class="col-md-4">
                            <label class="small">Jugador</label>
                            <select id="playerSelect" class="form-select bg-secondary text-white"></select>
                        </div>
                        <div class="col-md-3">
                            <label class="small">Puesto</label>
                            <select id="puestoSelect" class="form-select">
                                <option value="5">1° Lugar (+5)</option>
                                <option value="4">2° Lugar (+4)</option>
                                <option value="2">3° Lugar (+2)</option>
                                <option value="1">4° Lugar o menos (+1)</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="small">Estrellas</label>
                            <select id="estrellasSelect" class="form-select">
                                <option value="3">5 Estrellas (+3)</option>
                                <option value="2">4 Estrellas (+2)</option>
                                <option value="1">3 Estrellas (+1)</option>
                                <option value="0">2 o menos (0)</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-success w-100" onclick="saveScore()">Añadir</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- OVERLAY RULETA -->
<div id="overlay" class="overlay">
    <div class="pointer">▼</div>
    <div class="scene">
        <div id="carousel" class="carousel"></div>
    </div>
</div>

<script>
let songs = [];
let filtered = [];
let history = [];
let players = [];
let currentRotation = 0;

fetch('canciones.json').then(r => r.json()).then(data => {
    songs = data;
    const select = document.getElementById('gameSelect');
    const games = [...new Set(songs.map(s => s.juego))];
    select.innerHTML = '<option value="">Selecciona Just Dance...</option>';
    games.forEach(g => {
        let opt = document.createElement('option');
        opt.value = g; opt.textContent = g;
        select.appendChild(opt);
    });
});

document.getElementById('gameSelect').addEventListener('change', e => {
    filtered = songs.filter(s => s.juego === e.target.value && s.portadaDisponible);
    history = [];
    createWheel();
});

function createWheel() {
    const carousel = document.getElementById('carousel');
    carousel.innerHTML = "";
    if(filtered.length === 0) return;
    const visibleCount = Math.min(filtered.length, 20);
    const list = filtered.slice(0, visibleCount);
    const angle = 360 / list.length;
    const radius = 900;

    list.forEach((song, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.transform = `rotateY(${i * angle}deg) translateZ(${radius}px)`;
        card.innerHTML = `
            <img src="portadas/${song.version}/${song.codigo}.webp" onerror="this.src='portadas/default.webp'">
            <div class="title">${song.cancion}</div>
        `;
        carousel.appendChild(card);
    });
}

function spin() {
    if(filtered.length === 0) return;
    const overlay = document.getElementById('overlay');
    const carousel = document.getElementById('carousel');
    overlay.classList.add('active');

    const visibleCount = Math.min(filtered.length, 20);
    const visibleSongs = filtered.slice(0, visibleCount);
    if(history.length >= visibleSongs.length) history = [];
    const random = visibleSongs.filter(s => !history.includes(s.codigo))[Math.floor(Math.random() * (visibleSongs.length - history.length))];
    history.push(random.codigo);

    const anglePerCard = 360 / visibleCount;
    const index = visibleSongs.indexOf(random);
    const baseVueltas = Math.ceil(currentRotation / 360) * 360;
    currentRotation = baseVueltas + 3600 + (index * anglePerCard);

    carousel.style.transform = `rotateY(${-currentRotation}deg)`;

    setTimeout(() => {
        showResult(random);
        overlay.classList.remove('active');
    }, 12000);
}

function showResult(song) {
    document.getElementById('songName').textContent = song.cancion;
    document.getElementById('artist').textContent = song.artista;
    document.getElementById('cover').src = `portadas/${song.version}/${song.codigo}.webp`;
    document.getElementById('audio').src = `musica/${song.version}/${song.codigo}.ogg`;
    document.getElementById('audio').play().catch(()=>{});
    if(players.length > 0) document.getElementById('scoreForm').style.display = 'block';
}

// LÓGICA DE JUGADORES Y PUNTOS
function addPlayer() {
    const nameInput = document.getElementById('playerName');
    const name = nameInput.value.trim();
    if (name && !players.find(p => p.nombre === name)) {
        players.push({ nombre: name, bailes: 0, puntosPuesto: 0, bonificacion: 0, total: 0 });
        nameInput.value = "";
        updateLeaderboard();
    }
}

function updateLeaderboard() {
    const tbody = document.getElementById('leaderboardBody');
    const select = document.getElementById('playerSelect');
    tbody.innerHTML = "";
    select.innerHTML = '';
    
    players.sort((a, b) => b.total - a.total);
    players.forEach(p => {
        tbody.innerHTML += `
            <tr>
                <td class="text-start">${p.nombre}</td>
                <td>${p.bailes}</td>
                <td>${p.puntosPuesto}</td>
                <td>${p.bonificacion}</td>
                <td class="fw-bold text-warning">${p.total}</td>
            </tr>`;
        select.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`;
    });
}

function saveScore() {
    const playerName = document.getElementById('playerSelect').value;
    const puntosPuesto = parseInt(document.getElementById('puestoSelect').value);
    const puntosBonif = parseInt(document.getElementById('estrellasSelect').value);
    
    if (playerName) {
        const player = players.find(p => p.nombre === playerName);
        player.bailes += 1;
        player.puntosPuesto += puntosPuesto;
        player.bonificacion += puntosBonif;
        player.total = player.puntosPuesto + player.bonificacion;
        
        updateLeaderboard();
        // No ocultamos el formulario de inmediato por si bailaron varios la misma canción
        alert(`¡Puntos guardados para ${playerName}!`);
    }
}
</script>
</body>
</html>
